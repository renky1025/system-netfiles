version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: netfilessys-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: netfilessys
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netfilessys-network

  redis:
    image: redis:6-alpine
    container_name: netfilessys-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - netfilessys-network

volumes:
  postgres_data:

networks:
  netfilessys-network:
    driver: bridge
